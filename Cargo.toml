[workspace]
resolver = "2"
members = [
  "crates/legend_core",
  "crates/legend_cli",
  "desktop",
]
# Building everything (incl. the Tauri desktop shell) requires frontend/dist
# and platform GUI deps; keep day-to-day cargo invocations on engine + CLI.
default-members = ["crates/legend_core", "crates/legend_cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = "0.4"
fastrand = "2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"

# Desktop (Tauri v2) — wired into the workspace but built explicitly.
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
